openapi: 3.1.0
info:
  title: Agent Office Core API
  version: 1.0.0
  description: Local-only Phase 1 daemon contract for Claude Code telemetry. Browser mutations require exact Origin and X-CSRF-Token; agent ingest uses scoped bearer credentials.
servers:
  - url: http://127.0.0.1:8080
  - url: https://my-studio.victorpham.dev
paths:
  /healthz:
    get:
      responses: {'200': {description: Health and setup status}, '403': {description: Host rejected}}
  /v1/auth/login:
    post:
      parameters: [{in: header, name: Origin, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses: {'200': {description: Session cookie and CSRF token}, '400': {description: Malformed JSON}, '401': {$ref: '#/components/responses/Unauthorized'}, '429': {description: Five attempts per peer or twenty global attempts per minute}}
  /v1/auth/logout:
    post:
      security: [{cookieAuth: []}]
      parameters: [{in: header, name: X-CSRF-Token, required: true, schema: {type: string}}]
      responses: {'200': {description: Session revoked}}
  /v1/me:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Current manager session}}
  /v1/agents:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Agent projections}}
  /v1/channels:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Channel projections}}
  /v1/agents/enrollment:
    post:
      security: [{cookieAuth: []}]
      parameters: [{in: header, name: X-CSRF-Token, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EnrollmentRequest'}}}}
      responses: {'201': {description: One-time enrollment credential}}
  /v1/agents/register:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationRequest'}}}}
      responses: {'201': {description: Session-scoped agent credential}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /v1/credentials/{credentialId}/revoke:
    post:
      security: [{cookieAuth: []}]
      parameters: [{in: path, name: credentialId, required: true, schema: {type: string}}, {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}]
      responses: {'200': {description: Credential revoked}}
  /v1/agents/events:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Telemetry'}}}}
      responses: {'201': {description: Server-derived event envelope}, '400': {description: Malformed or invalid telemetry}, '401': {$ref: '#/components/responses/Unauthorized'}, '409': {description: Conflicting event or cursor state}, '413': {description: Event body exceeds 64 KiB}, '429': {description: Per-session or global event admission limit}}
  /v1/events:
    get:
      security: [{cookieAuth: []}]
      parameters: [{name: generation, in: query, required: true, schema: {type: string}}, {name: after, in: query, required: true, schema: {type: integer, minimum: 0}}]
      responses: {'200': {description: Replay page with deltas nextAfter hasMore and highWater}, '409': {description: Generation or future cursor reset}}
  /v1/seats/{id}/handoff:
    get:
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: '{handoff: SeatHandoff | null}'}, '403': {description: Agent asked for another seat (forbidden_handoff)}, '404': {description: Unknown seat}}
    put:
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [body], additionalProperties: false, properties: {body: {type: string, maxLength: 8000}}}}}}
      responses: {'200': {description: Saved SeatHandoff}, '403': {description: Agent may only write its own seat}}
  /v1/runners/register:
    post:
      description: Runner (connector credential) offers the seats of its local runner.json. Unknown seat ids are refused.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [machine, seats], properties: {machine: {type: string, maxLength: 120}, seats: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/RunnerSeat'}}}}}}}
      responses: {'200': {description: '{refused: string[]}'}, '401': {description: Not a connector credential}}
  /v1/runners/me/commands:
    get:
      description: Long-poll (wait ≤ 60 s) for manager commands; returned commands are marked sent.
      security: [{bearerAuth: []}]
      parameters: [{in: query, name: wait, schema: {type: integer, minimum: 0, maximum: 60}}]
      responses: {'200': {description: '{commands: RunnerCommand[]}'}}
  /v1/runners/me/commands/{id}/result:
    post:
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [ok, message], properties: {ok: {type: boolean}, message: {type: string, maxLength: 2000}}}}}}
      responses: {'200': {description: Completed RunnerCommand}}
  /v1/runners/me/status:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [seats], properties: {seats: {type: array, items: {$ref: '#/components/schemas/RunnerSeat'}}}}}}}
      responses: {'200': {description: ok}}
  /v1/runners/me/log:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [entries], properties: {entries: {type: array, maxItems: 200, items: {type: object, required: [seatId, ts, kind, summary], properties: {seatId: {type: string}, ts: {type: integer}, kind: {type: string, enum: [text, tool, result, error, state, prompt]}, summary: {type: string, maxLength: 500}}}}}}}}}
      responses: {'200': {description: ok}}
  /v1/runners:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: '{runners: RunnerView[]}'}}
  /v1/seats/{id}/runner-commands:
    get:
      security: [{cookieAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: '{commands: RunnerCommand[]} (audit, newest first, 20)'}}
    post:
      description: Queue start | stop | restart | interrupt | prompt for the online runner offering the seat. Expires after 2 min. Max 30/min.
      security: [{cookieAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kind], additionalProperties: false, properties: {kind: {type: string, enum: [start, stop, restart, interrupt, prompt]}, text: {type: string, maxLength: 8000}}}}}}
      responses: {'201': {description: Queued RunnerCommand}, '409': {description: no_runner_for_seat | runner_offline | too_many_commands}}
  /v1/seats/{id}/runner-log:
    get:
      security: [{cookieAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: '{entries: RunnerLogEntry[]} (last 300, in memory)'}}
  /v1/machines:
    post:
      security: [{cookieAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [label], properties: {label: {type: string, maxLength: 80}}}}}}
      responses: {'201': {description: RunnerView of the new machine}}
  /v1/machines/{id}:
    patch:
      security: [{cookieAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [label], properties: {label: {type: string, maxLength: 80}}}}}}
      responses: {'200': {description: Renamed}}
    delete:
      description: Deletes the machine and revokes its connector credentials.
      security: [{cookieAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Deleted}}
  /v1/machines/{id}/config:
    put:
      description: Replaces the seat list (live-synced to the runner). Seats must exist and run on one machine only.
      security: [{cookieAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [seats], properties: {seats: {type: array, maxItems: 20, items: {type: object, required: [seatId, cwd], properties: {seatId: {type: string}, cwd: {type: string, description: absolute path}, permissionMode: {type: string, enum: [default, acceptEdits, plan, bypassPermissions]}, sessionId: {type: [string, 'null']}, autoStart: {type: boolean}}}}}}}}}
      responses: {'200': {description: '{version, seats}'}, '400': {description: duplicate_seat | invalid path}, '404': {description: seat_not_found}, '409': {description: 'seat_on_other_machine:<seat>'}}
  /v1/machines/{id}/sessions:
    get:
      security: [{cookieAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: '{sessions: MachineSession[]} registered by this machine, newest first'}}
  /v1/machines/{id}/install-code:
    post:
      security: [{cookieAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'201': {description: '{code, expiresAt, uses, commands: {unix, windows}} — one use, 24 h, bound to the machine'}}
  /v1/runners/me/config:
    get:
      security: [{bearerAuth: []}]
      responses: {'200': {description: '{version, seats} for this machine'}}
  /v1/notify/telegram:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: '{enabled, paired, botUsername}'}}
    delete:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Unpaired}}
  /v1/notify/telegram/pair:
    post:
      security: [{cookieAuth: []}]
      responses: {'201': {description: '{code, expiresAt, link} — send /start <code> to the bot within 10 min'}, '409': {description: telegram_disabled}}
  /v1/notify/telegram/test:
    post:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Sent}, '502': {description: not_paired | telegram_unreachable}}
  /v1/permissions:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: '{enabled: boolean, pending: PermissionRequest[]}'}}
    post:
      security: [{bearerAuth: []}]
      description: Filed by the PermissionRequest hook. String inputs only, each truncated to 2000 chars.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [tool], additionalProperties: false, properties: {tool: {type: string, maxLength: 128}, input: {type: object}}}}}}
      responses: {'201': {description: Pending PermissionRequest}, '403': {description: remote_approval_disabled}, '409': {description: too_many_pending_permissions (8 per agent)}}
  /v1/permissions/{id}/decision:
    get:
      security: [{bearerAuth: []}]
      description: Long-poll by the agent that filed the request. Still pending when the wait ends → status expired.
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: query, name: wait, schema: {type: integer, minimum: 0, maximum: 600}}]
      responses: {'200': {description: PermissionRequest with status allowed | denied | expired}, '403': {description: Not the filing agent}}
    post:
      security: [{cookieAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: header, name: X-CSRF-Token, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [behavior], additionalProperties: false, properties: {behavior: {enum: [allow, deny]}, message: {type: string, maxLength: 500}}}}}}
      responses: {'200': {description: Decided PermissionRequest}, '409': {description: permission_already_resolved}}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: agent_office_session}
    bearerAuth: {type: http, scheme: bearer}
  responses:
    Unauthorized: {description: Authentication failed}
  schemas:
    RunnerSeat:
      type: object
      required: [seatId, state, sessionId, restarts, permissionMode, detail]
      properties: {seatId: {type: string}, state: {type: string, enum: [starting, running, idle, stopped, failed]}, sessionId: {type: [string, 'null']}, restarts: {type: integer}, permissionMode: {type: string}, detail: {type: string, maxLength: 300}}
    LoginRequest: {type: object, required: [password], additionalProperties: false, properties: {password: {type: string, minLength: 1, maxLength: 256, description: 'Login accepts any non-empty attempt; first-run setup/reset enforces 12+ characters.'}}}
    EnrollmentRequest:
      type: object
      required: [agentId, project, sessionId, incarnation]
      additionalProperties: false
      properties: {agentId: {type: string, minLength: 1, maxLength: 128}, project: {type: string, minLength: 1, maxLength: 512}, sessionId: {type: string, minLength: 1, maxLength: 128}, incarnation: {type: string, minLength: 1, maxLength: 128}}
    RegistrationRequest: {type: object, required: [nonce], additionalProperties: false, properties: {nonce: {type: string, minLength: 1, maxLength: 128}}}
    Telemetry:
      type: object
      required: [id, ts, kind]
      description: 'Runtime requires turnId for non-session events and invocationId for tool events. Other known fields remain optional because source hooks may omit correlation.'
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        ts: {type: string, format: date-time}
        kind: {type: string, enum: [session.start, session.end, turn.start, turn.stop, tool.start, tool.done, tool.fail, permission.request]}
        turnId: {type: string, minLength: 1, maxLength: 128}
        invocationId: {type: string, minLength: 1, maxLength: 128}
        tool: {type: string, maxLength: 128}
        summary: {type: string, maxLength: 200}
