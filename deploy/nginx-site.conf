# nginx site for Agent Office behind an existing host nginx. Install (replace domain/port):
#   sed "s/__DOMAIN__/my-studio.example.com/g; s/__PORT__/8090/g" deploy/nginx-site.conf > /etc/nginx/sites-available/my-studio.example.com
#   ln -s /etc/nginx/sites-available/my-studio.example.com /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#   certbot --nginx -d my-studio.example.com   # adds the 443 server and the http → https redirect

map $http_upgrade $agent_office_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 1M;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so the daemon's last-hop rule sees the real client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agent_office_connection;
        # Stop-hook and permission long-polls wait up to ~10 minutes; the manager WebSocket stays open.
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
