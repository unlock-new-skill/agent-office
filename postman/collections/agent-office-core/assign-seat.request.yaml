$kind: http-request
method: PUT
url: '{{base_url}}/v1/seats/{{seat_id}}/agent'
order: 11600
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Origin
    value: '{{base_url}}'
  - key: X-CSRF-Token
    value: '{{csrf_token}}'
body:
  type: json
  content: |-
    {"agentId":"{{agent_id}}"}
